<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* css로 제어하고 싶은 대상을 가리킬때 사용되는 식별자를 가리켜 selector(선택지)라 한다
        선택자의 유형은 여라가지가 있다.
        1).class명 선택지
        2) 태그명 선택자
         */
        img {
            width: 150px;
            height: 45px;
            border: 1px solid red;
        }
    </style>
</head>
<body>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWeFsA2hKBKS3y9JyJt7EZGjElhuH2EMkd7VHscHwCdh0lzcWGVpXG1mM&s=10" alt="">
</body>
</html>
