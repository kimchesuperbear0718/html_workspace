<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{margin:0px;}
        .container{
            width: 100%;
            height:700px;
            background-color: yellow;
            position: relative;
        }
        img{
            width: 100px;
            position: absolute; /*노란색 배경인 부모 div를 기준으로
            아이콘들의 위치를 결정할 예정이므로..*/
        }
        #p1{left:0px;top:250px}
        #p2{left:0px;top:400px}
        #p3{left:150px;top:250px}

    </style>
    <script>
        function move(){
            /* 브라우저에서 발생하는 모든 이벤트는 js의 event 객체로
            그 정보가 메모리에 올라옴*/
            console.log(event);
            let x = event.clientX; //마우스의 x좌표
            let y = event.clientY; //마우스의 y좌표
            document.getElementById("info").innerText=`마우스 x축=${x}, 마우스 y축=${y}`;
        }        
    </script>
</head>
<!-- onMouseMove 는 사용자가 마우스를 움직이는 동안 발생하는 이벤트를
 감지하는 핸들러 -->
<body onMouseMove="move()">
    <div class="container">        
        <img src="../images/hanayama.jpg" id="p1">
        <img src="../images/lets.jpg" id="p2">
        <img src="../images/hanma.jpg" id="p3">
    </div>    
    <h2 id="info">마우스 좌표</h2>
</body>
</html>
