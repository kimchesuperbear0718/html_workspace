<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box {
            width: 50px;
            height: 50px;
            background-color: red;
            position: absolute;
            left: 0px;
            top: 100px;
        }
    </style>
    <script>
        let x =0;
        let flag = true;

        function manual() {
            if (flag) {
                x = x + 10;
            } else {
                x = x - 10;
            }

            if (x >=500) {
                flag = false;
            }

            if (x <=0) {
                flag = true;
            }

            document.getElementById("box").style.left
                = x + "px";
        }

        function auto() {
            setInterval("manual()",100);
        }
    </script>
</head>
<body>
    <button onclick="manual()">수동</button>
    <button onclick="auto()">자동</button>

    <div id="box"></div>
    
</body>
</html>
