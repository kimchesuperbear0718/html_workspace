<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 700px;
            height: 500px;
            float: left;
            margin: auto;

        } 
        .control{
            width: 200px;
            height: 500px;
            background-color: aqua;
            float: left;
        }
        .content{
            width: 500px;
            height: 500px;
            background-color: aquamarine;
            float: left;
            text-align: center;
        }
        .content img{
            width: 200px;
            opacity: 1;/*0~1 투명도 조절값 , 0이면 투명 1이면 불투명*/
            rotate:0deg; /*북쪽이 0도이며, 시계 방향으로 각도가 증가*/
        }

    </style>
    <script>
        //css3 부터는 상당히 수준높은 고퀼리티의 css 제어가 가능
        //예) 포토샵의 필터와 비슷한 기능도 지원
       let w=200, h=150, op=1, r=0; 
        function widthplus(){
            //alert("나 눌렀어?");
            //alert("나 눌렀어?");
            w= w + 10;
            document.getElementById("pic").style.width= w + "px";
        }
        function widthless(){
            w= w - 10;
            document.getElementById("pic").style.width= w - "px";
        }
        function heightup(){
            h= h + 10;
            document.getAnimations("pic").style.width= h + "px";
        }
        function heightdown(){
            h= h - 10;
            document.getAnimations("pic").style.width= h - "px";
        }

        function minusOpa(){
            op = op-0.1;
            document.getElementById("pic").style.opacity=op;
        }
        function PlusOpa(){
            op = op+0.1;
            document.getElementById("pic").style.opacity=op;
        }
        function addRotate(){
            r= r + 5;
            document.getElementById("pic").style.rotate= r + "deg";
        }
        function addRotate(){
            r= r - 5;
            document.getElementById("pic").style.rotate= r - "deg";
        }
        
    </script>
</head>
<body>
    <div class="container"></div>
    <div class="control">
        <div>
            <button onClick="widthplus()">너비+</button>
            <button onClick="widthless()">너비-</button>
        </div>
        <div>
            <button onClick="heightup()">높이+</button>
            <button onClick="heightdown()">높이-</button>
        </div>
        <div>
            <button>투명도+</button>
            <button onClick="minusOpa()">투명도-</button>
        </div>
        <div>
            <button onClick="addRotate()">회전+</button>
            <button>회전-</button>
        </div>
    </div>
    <div class="content">
        <img src="../../images/son/son.png" alt="" id="pic">
    </div>
</body>
</html>
