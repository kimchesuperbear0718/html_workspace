<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 500px;
            height: 450px;
            background-color: aqua;
            margin: auto;
        }
        .content{
            width: 100%;
            height: 400px;
            background-color: bisque;

        }
        .content img{
            width: 100%;
            height: 400px;
        }
        .control{
            width: 100%;
            height: 50px;
            background-color: aquamarine;
            line-height: 50px;
            text-align: center; /*수평의 가운데 정렬*/
        }

    </style>
    <script>
        let n=1;
        //브라우저가 실행되는 동안 이미지명이 1,2,3,4...10해 접근하는 문법
        function next(){
            n++;// n=n+1;
            //아직 진도는 조건문을 배우지 않았으나,월요일에 java시간에 
            //조건문을 배웠으므로, 살짝 보여주기
            document.getElementById("pic").src="../../images/"+n+".webp";
        }

        //이전 사진
        function prev(){
            n--;
            document.getElementById("pic").src="../../images/"+n+".webp";
        }
    </script>
</head>
<body>

    <div class="container">
        <div class="content">
            <img src="../../images/1.webp" alt="" id="pic">
        </div>
            <div class="control">
            <button onclick="prev()">이전</button>
            <button onclick="next()">다음</button>
    </div>
</div>

</body>
</html>
