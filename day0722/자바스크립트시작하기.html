<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <!--[개념] 
    HTML/css 는 프로그래밍 언어가 아니므로,
     게임,쇼핑,채팅 등 응용 프로그램을 자체적으로 재작할수없다....
     해결책? html에 프로그래밍 능력을 부여해야함..
     그래서 출시된 언어가 바로 JavaScript
     
     
     [작성명]
     script 태그안에 작성한다
     -->
     <script>
        /*
            이 영역은 html 이 아닌 js의 영역이므로 까다로움
            대소문자 등을 조심해야 함*/
            //console.log("hello");
            /*
            js는 컴파일 기반의 프로그래밍 언어가 아니므로
            자료형을 개발자가 명시하지 않는다..(진입장벽이 낮다)
            */
           //int y=3; java의 경우 컴파일 시점에 자료형을 결정
           //짓기 때문에 추후에는 자료형 판단을 하지 않고 실행하므로
           //속도가 상대적으로 빠르다..
           //하지만,js,python 같은 자료형을 명시하지 않는
           //인터픨터 언어의 경우에는, 상대적으로 실행속도가
           //느리다...
            let x=3;//js야 메모리에 공간을 만들어서 3을 담아놓아
                //그리고 그 3이 담겨진 공간의 이름을 x라고 불러줘
            //모든~~프로그래밍 언어에서 데이터가 메모리에 생성되는
            //시점은 바로 실행할때이다!!!!
            //java -> java 클래스명
            // js ->브라우저 실행 시 
            // 전역변수가 메모리에서 사라지는 지점은 브라우저 종료시
     </script>
</head>
<body>
    5+6
</body>
</html>
