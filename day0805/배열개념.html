<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        //대량의 데이터를 처라함에 있어서, 변수 선언방법으로 데이터를
        //메모리에 생성하는 방법은 불리하다~
        //해결책? 처리할 데이터의 수가 다수인 경우엔
        let a1="apple";
        let a2="banana";
        let a3="water melon";
        let a4="pear";
        let a5="mango";
        //a모든 과일을 출력하세요
        document.write(a1);
        document.write(a2);
        document.write(a3);
        document.write(a4);
        document.write(a5);

        //배열을 이용하여 데이터 메모리 올리기
        let fruit = ["apple","grape", "banana", "orange", "melon"];

        //개발자는 배열을 선언할때는 마음속으로 이미 반복문으 염두해 두자
        for(let i=0; i<5; i++){
            document.write(fruit[i]);
        }

    </script>
</head>
<body>
    
</body>
</html>
