<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 350px;
            height: 450px;
            background-color: black;
            margin: auto;
        }
        .header{
            width: 100%;
            height: 50px;
            background-color: aqua;
        }
        .content{
            width: 100%;
            height: 400px;
            background-color: bisque;
        }

        .header div{
            width: 50px;
            height: 50px;
            float: left;
        }
        .box1{background-color: red;}
        .box2{background-color: orange;}
        .box3{background-color: yellow;}
        .box4{background-color: green;}
        .box5{background-color: blue;}
        .box6{background-color: navy;}
        .box7{background-color: purple;}
    </style>
    <script>
        function setBg(color){
            // 문서내의 content라는 id를 갖는 요소의 배경색을 red 로 적용
            //이 함수를 모든 색상에 대응되는 함수로 정의하려면
            //적용 색상을 고정시키지 말고,함수 호출자가 그 값을 결정하도록
            //매개변수로 처리하자
            document.getElementById("content").style.backgroundColor=color;

        }
    </script>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="box1" onMouseOver="setBg(`red`)"></div>
            <div class="box2" onMouseOver="setBg(`orange`)"></div>
            <div class="box3" onMouseOver="setBg(`yellow`)"></div>
            <div class="box4" onMouseOver="setBg(`green`)"></div>
            <div class="box5" onMouseOver="setBg(`blue`)"></div>
            <div class="box6" onMouseOver="setBg(`navy`)"></div>
            <div class="box7" onMouseOver="setBg(`purple`)"></div>
        </div>
        <div class="content" name="" id="content"></div>
    </div>

</body>
</html>
