<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 800px;
            height: 600px;
            background-color: yellow;
            margin:auto;/*현재 div의 바깥쪽 여백인 마진을 구해서
            양쪽에 동일하게 배분해주는 속성,모니터 크기에 상관없이
            언제나 중앙에 위치시킴
            */
        }/*block 요소를 float으로 띄운 대상들은 서로 공존 할수있다*/
        #leftside{
            width: 400px;
            height: 500px;
            background-color: red;
            float: left;
        }
        #rightside{
            width: 400px;
            height: 500px;
            background-color: blue;
            float: right;
        }
        #footer{
            width: 100%;
            height: 100px;
            background-color: green;
            float: both;/*이전의 float 된 요소에 영향을 받지 않겠다
                float된 대상이 left,right 이건 상관없이 모두..
                결론 footer 는 float 된 요소를 밑으로 파고들어가지 않음
                */
        }
        /*모두 float으로 처리하면,결과는 성공하지만 많은 수의
        div 에 대해 float 으로 처리해야 하므로,이 문제를 해결하기 위한 css의 많은 기능이 
        있다*/
    </style>
</head>
<body>
    <!--가장 바깥쪽에는 div들을 감쌀 컨테이너를 정의-->
    <div id="container">
        <div id="leftside">빨간색 박스</div>
        <div id="rightside">파란색 박스</div>
        <div id="footer">푸터 영역</div>
    </div>
</body>
</html>
