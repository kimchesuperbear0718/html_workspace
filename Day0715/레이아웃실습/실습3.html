<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            width: 1000px;
            height: 450px;
            background-color: gray;
        }

        #up{
            width: 1000px;
            height: 50px;
            background-color: aqua;
            float: left;
        }
        #upq{
            width: 1000px;
            height: 50px;
            background-color: aquamarine;
            float: left;

        }
        #left{
            width: 500px;
            height: 300px;
            background-color: palevioletred;
            float: left;
        }
        #right{
            width: 500px;
            height: 300px;
            background-color: bisque;
            float: right;
        }
        #down{
            width: 1000px;
            height: 50px;
            background-color: aqua;
            clear: both;
        }

    </style>
</head>
<body>
    <div id="box">
        <div id="up"></div>
        <div id="upq"></div>
        <div id="right"></div>
        <div id="left"></div>
        <div id="down"></div>
    </div>
    
</body>
</html>
