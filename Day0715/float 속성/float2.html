<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*HTML 에서 이미지와 텍스트를 공존시키면, 서로의 높이 차 때문에
        이미지의 옆 공간이 비어있는 것처럼 보이게 되는데,문서의 형식이
        깨진것처럼 보인다(사실은 정상)
        해결책? 이미지의 현재 위치를 정상적인 위치에서 벗어나도록 공중으로
                띄우는 기술을 적용*/
        img{
            width: 150px;
            float: left;
        }
        /*div는 block 형이고,block 속성은 float 되어있는 물체를 볼수
        없으므로,이미지의 자리를 파고 들어가버리는 현상..
        단 텍스트는 인라인 속성을 갖는 요소이다.
        주의)일반적인 텍스트도 html 전체 문서내에서의 요소라 불리고,
            기본적으로 inline속성을 가지고 있다.
            inline 속성을 갖는 요소는 float 된 요소를 볼수 있으므로,
            빈자리를 메꾸지 않고 피해간다 
        */

        div{
            width: 300px;
            height: 300px;
            background-color: red;
        }
    
    </style>
</head>
<body>
    <img src="http://picsum.photos/150" alt="실습용 이미지">
    <div>난 box1</div>
    

</body>
</html>
